version: "3"

dotenv: [".env.example", ".env"]

vars:
  COMPOSE_ENV_FILE:
    sh: 'if [ -f .env ]; then echo .env; elif [ -f .env.example ]; then echo .env.example; fi'

tasks:
  run:memory:
    desc: Run full stack in Docker with in-memory storage
    silent: true
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" down --remove-orphans
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" up --build -d backend-memory frontend-memory
      - task links

  run:postgres:
    desc: Run full stack in Docker with PostgreSQL storage
    silent: true
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" down --remove-orphans
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" up --build -d postgres migrate backend-postgres frontend
      - task links

  down:
    desc: Stop containers
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" down --remove-orphans

  down:volumes:
    desc: Stop containers and remove database volume
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" down -v --remove-orphans

  logs:
    desc: Tail all logs
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" logs -f --tail=200

  ps:
    desc: Show containers
    cmds:
      - docker compose --env-file "{{.COMPOSE_ENV_FILE}}" ps

  links:
    desc: Print local URLs
    silent: true
    cmds:
      - 'echo ""'
      - 'echo "Frontend: http://127.0.0.1:5173"'
      - 'echo "Backend:  http://127.0.0.1:${HTTP_PORT}"'
      - 'echo ""'

  frontend:install:
    desc: Install frontend dependencies
    dir: ./frontend
    cmds:
      - npm install

  sqlc:
    desc: Generate sqlc code
    cmds:
      - sqlc generate

  mocks:
    desc: Generate gomock mocks
    cmds:
      - go generate ./internal/usecase/link_service ./internal/controller/http

  generate:
    desc: Run all code generators
    cmds:
      - task sqlc
      - task mocks

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run unit tests with verbose output
    cmds:
      - go test -v ./...

  test:race:
    desc: Run unit tests with race detector
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run PostgreSQL integration tests
    cmds:
      - TEST_DATABASE_DSN="$LOCAL_DATABASE_DSN" go test -tags=integration -v ./internal/repository/postgres

  check:
    desc: Run formatting, vet and tests
    cmds:
      - go fmt ./...
      - go vet ./...
      - go test ./...

  check:full:
    desc: Run full local checks
    cmds:
      - go fmt ./...
      - go vet ./...
      - go test -race ./...
      - task test:integration
