services:
  postgres:
    image: postgres:18-alpine
    container_name: shortener-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: migrate.Dockerfile
    container_name: shortener-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "${DATABASE_DSN}"
      - "up"

  backend-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortener-backend-postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV}
      STORAGE_TYPE: postgres
      HTTP_ADDR: :8080
      BASE_URL: ${BASE_URL}
      DATABASE_DSN: ${DATABASE_DSN}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT}
    ports:
      - "${HTTP_PORT}:8080"
    networks:
      default:
        aliases:
          - backend

  backend-memory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortener-backend-memory
    environment:
      APP_ENV: ${APP_ENV}
      STORAGE_TYPE: memory
      HTTP_ADDR: :8080
      BASE_URL: ${BASE_URL}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT}
    ports:
      - "${HTTP_PORT}:8080"
    networks:
      default:
        aliases:
          - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortener-frontend-postgres
    depends_on:
      - backend-postgres
    ports:
      - "5173:80"

  frontend-memory:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shortener-frontend-memory
    depends_on:
      - backend-memory
    ports:
      - "5173:80"

volumes:
  postgres_data:
